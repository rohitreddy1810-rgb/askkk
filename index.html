<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Valentine Letter</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <!-- Envelope Screen -->
  <div id="envelope-container">
    <img src="envelope.png" alt="Envelope" id="envelope" />
    <p>💌 Letter for You 💌</p>
  </div>

  <!-- Letter Screen -->
  <div id="letter-container">
    <div class="letter-window">
      <h1 id="letter-title">Will you be my Valentine baby?</h1>

      <img src="cat_heart.gif" class="cat" id="letter-cat" />

      <div class="buttons" id="letter-buttons">
        <img src="yes.png" class="btn yes-btn" alt="Yes" />

        <div class="no-wrapper">
          <img src="no.png" class="btn no-btn" alt="No" />
        </div>
      </div>

      <p id="final-text" class="final-text" style="display: none;">
        <strong>Valentine Date:</strong> Glens Bakehouse at 1pm ❤️ see you soon cutiee piee
      </p>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
<!-- Audio -->
<audio id="bgMusic" src="bg-music.mp3" loop></audio>
<audio id="clickSound" src="click.mp3"></audio>
<audio id="yaySound" src="yay.mp3"></audio>

</body>
</html>
